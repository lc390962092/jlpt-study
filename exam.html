<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="JLPT 日语学习应用，支持 N1-N5 词汇、语法学习与真题测试">
    <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="JLPT学习">
        <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" href="icons/icon-96x96.png">
<title>JLPT 真题导入</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        /* 页面特有微调：保持公共样式已覆盖，此处留空备用 */
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="back">← 返回</a>
        <div class="level-title">真题导入</div>
        <div style="width:40px"></div>
    </div>
    <div class="stage" id="stage">
        <div class="msg">加载中...</div>
    </div>

    <script src="js/common.js"></script>
    <script>
        const stageEl = document.getElementById('stage');
        const EXAMS_KEY = 'jlpt_imported_exams';
        const BOOKMARKS_KEY = 'jlpt_exam_bookmarks';
        const HISTORY_KEY = 'jlpt_exam_history';

        let exams = [];
        let currentExam = null;
        let currentQuestions = [];
        let currentIdx = 0;
        let correctCount = 0;
        let sectionStats = {};
        let currentAnswers = [];
        let currentBookmarks = [];

        function init() {
            loadExams();
            loadBookmarks();
            renderList();
        }

        function loadExams() {
            try { exams = JSON.parse(localStorage.getItem(EXAMS_KEY)) || []; }
            catch { exams = []; }
        }
        function saveExams() {
            localStorage.setItem(EXAMS_KEY, JSON.stringify(exams));
        }
        function loadBookmarks() {
            try { currentBookmarks = JSON.parse(localStorage.getItem(BOOKMARKS_KEY)) || []; }
            catch { currentBookmarks = []; }
        }
        function saveBookmarks() {
            localStorage.setItem(BOOKMARKS_KEY, JSON.stringify(currentBookmarks.slice(-500)));
        }
        function isBookmarked(q) {
            return currentBookmarks.some(b => b.qid === q.id);
        }
        function toggleBookmark(q) {
            const idx = currentBookmarks.findIndex(b => b.qid === q.id);
            if (idx >= 0) {
                currentBookmarks.splice(idx, 1);
            } else {
                currentBookmarks.push({
                    qid: q.id,
                    type: q.type,
                    question: q.question,
                    options: q.options,
                    answer: q.answer,
                    explanation: q.explanation || '',
                    sectionName: q.sectionName || '',
                    level: currentExam ? currentExam.level : '',
                    examTitle: currentExam ? currentExam.title : '',
                    createdAt: new Date().toISOString()
                });
            }
            saveBookmarks();
            return idx < 0;
        }

        function renderList() {
            const history = getHistory();
            const recentHistory = history.slice(0, 5);
            const totalDone = history.reduce((sum, h) => sum + h.total, 0);
            const totalCorrect = history.reduce((sum, h) => sum + h.correct, 0);
            const avgPct = totalDone ? Math.round((totalCorrect / totalDone) * 100) : 0;

            stageEl.innerHTML = `
                <div class="dashboard-row">
                    <a href="javascript:showBookmarks()" class="dash-card link">
                        <div class="num">${currentBookmarks.length}</div>
                        <div class="label">收藏</div>
                    </a>
                    <div class="dash-card">
                        <div class="num">${totalDone}</div>
                        <div class="label">做题</div>
                    </div>
                    <div class="dash-card">
                        <div class="num">${avgPct}%</div>
                        <div class="label">平均正确率</div>
                    </div>
                </div>
                <div class="tab-row">
                    <div class="tab active" id="tabList">真题列表</div>
                    <div class="tab" id="tabImport">导入真题</div>
                </div>
                <div id="listPanel">
                    ${exams.length ? `<div class="exam-list">${exams.map((ex, i) => renderExamItem(ex, i)).join('')}</div>` : `<div class="empty-tip">暂无导入的真题<br>点击「导入真题」开始</div>`}
                    ${history.length ? `
                    <div class="panel" style="margin-top:20px;">
                        <h2>最近练习</h2>
                        <div class="history-list">
                            ${recentHistory.map(h => `
                                <div class="history-item">
                                    <div>
                                        <div class="title">${escapeHtml(h.examTitle || '练习')}</div>
                                        <div class="meta">${formatDate(h.date)} · ${h.correct}/${h.total} 正确</div>
                                    </div>
                                    <div class="pct">${h.pct}%</div>
                                </div>
                            `).join('')}
                        </div>
                        <button class="btn btn-secondary" onclick="showStatistics()">查看完整统计</button>
                    </div>` : ''}
                </div>
                <div id="importPanel" class="hidden">
                    <div class="panel">
                        <h2>导入 JLPT 真题</h2>
                        <div class="sub">支持文字・語彙、文法 JSON 格式，导入后本地保存</div>
                        <label class="upload-zone" id="dropZone">
                            <div class="icon">📄</div>
                            <div class="hint">点击上传 JSON 文件 或拖拽到此处</div>
                            <input type="file" id="fileInput" accept=".json,application/json">
                        </label>
                        <button class="btn btn-secondary" id="pasteBtn">粘贴 JSON 导入</button>
                        <button class="btn btn-primary" id="builtInBtn">一键导入内置真题</button>
                        <div class="json-sample">
                            格式说明：<br>
                            {<br>
                            &nbsp;&nbsp;"level": "N5",<br>
                            &nbsp;&nbsp;"year": 2024, "month": 7,<br>
                            &nbsp;&nbsp;"title": "N5 真题示例卷",<br>
                            &nbsp;&nbsp;"description": "...",<br>
                            &nbsp;&nbsp;"sections": [<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;{<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"id": "moji",<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"name": "文字・語彙",<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"questions": [<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{ "id": "...", "type": "kanji_reading", "question": "...", "options": [...], "answer": 0, "explanation": "..." }<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;]<br>
                            &nbsp;&nbsp;&nbsp;&nbsp;}<br>
                            &nbsp;&nbsp;]<br>
                            }
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('tabList').addEventListener('click', () => switchTab('list'));
            document.getElementById('tabImport').addEventListener('click', () => switchTab('import'));
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            document.getElementById('dropZone').addEventListener('dragover', (e) => { e.preventDefault(); e.currentTarget.style.borderColor = 'var(--primary)'; });
            document.getElementById('dropZone').addEventListener('dragleave', (e) => { e.currentTarget.style.borderColor = ''; });
            document.getElementById('dropZone').addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f); });
            document.getElementById('pasteBtn').addEventListener('click', importFromPaste);
            document.getElementById('builtInBtn').addEventListener('click', importBuiltInExams);
        }

        function switchTab(tab) {
            const listPanel = document.getElementById('listPanel');
            const importPanel = document.getElementById('importPanel');
            const tabList = document.getElementById('tabList');
            const tabImport = document.getElementById('tabImport');
            if (tab === 'list') {
                listPanel.classList.remove('hidden');
                importPanel.classList.add('hidden');
                tabList.classList.add('active');
                tabImport.classList.remove('active');
                renderList();
            } else {
                listPanel.classList.add('hidden');
                importPanel.classList.remove('hidden');
                tabList.classList.remove('active');
                tabImport.classList.add('active');
            }
        }

        function renderExamItem(ex, idx) {
            const sectionTags = (ex.sections || []).map(s => `<span class="tag ${s.id}">${s.name} ${s.questions?.length || 0}题</span>`).join('');
            const total = (ex.sections || []).reduce((sum, s) => sum + (s.questions?.length || 0), 0);
            const meta = [ex.level, ex.year ? `${ex.year}年${ex.month || ''}月` : '', `${total}题`].filter(Boolean).join(' · ');
            return `
                <div class="exam-item">
                    <div class="title">${escapeHtml(ex.title)}</div>
                    <div class="meta">${escapeHtml(meta)}</div>
                    <div class="tags">${sectionTags}</div>
                    <div class="exam-actions">
                        <button class="btn btn-primary" onclick="startExam(${idx})">开始测试</button>
                        <button class="btn btn-secondary" onclick="deleteExam(${idx})">删除</button>
                    </div>
                </div>
            `;
        }

        function handleFileSelect(e) {
            const f = e.target.files[0];
            if (f) readFile(f);
        }

        function readFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => importJson(e.target.result);
            reader.readAsText(file);
        }

        function importFromPaste() {
            const raw = prompt('请粘贴 JSON 内容：');
            if (raw && raw.trim()) importJson(raw.trim());
        }

        async function importBuiltInExams() {
            const basePath = location.pathname.replace(/\/[^\/]*$/, '/');
            const files = [
                'content/exams/N5_bunpou_266.json',
                'content/exams/N4_bunpou_90.json',
                'content/exams/N3_bunpou_200.json',
                'content/exams/N2_bunpou_90.json',
                'content/exams/N1_bunpou_1800.json'
            ];
            let count = 0;
            for (const file of files) {
                try {
                    const resp = await fetch(`${basePath}${file}`);
                    if (!resp.ok) continue;
                    const data = await resp.json();
                    const err = validateExam(data);
                    if (err) { console.warn(file, err); continue; }
                    normalizeExam(data);
                    const exists = exams.some(e => e.title === data.title);
                    if (!exists) {
                        exams.unshift(data);
                        count++;
                    }
                } catch (e) { console.warn(file, e); }
            }
            saveExams();
            if (count) alert(`已内置导入 ${count} 套真题`);
            else alert('内置真题已全部存在');
            renderList();
        }

        function importJson(raw) {
            let data;
            try {
                data = JSON.parse(raw);
            } catch {
                alert('JSON 解析失败，请检查格式');
                return;
            }
            const err = validateExam(data);
            if (err) { alert(err); return; }
            normalizeExam(data);
            exams.unshift(data);
            saveExams();
            alert(`已导入：${data.title}`);
            switchTab('list');
        }

        function validateExam(data) {
            if (!data || typeof data !== 'object') return 'JSON 格式不正确';
            if (!data.title) return '缺少 title';
            if (!Array.isArray(data.sections)) return '缺少 sections 数组';
            for (const sec of data.sections) {
                if (!sec.id || !sec.name) return '每个 section 必须包含 id 和 name';
                if (!Array.isArray(sec.questions)) return `${sec.name} 缺少 questions 数组`;
                for (const q of sec.questions) {
                    if (!q.id || !q.question || !Array.isArray(q.options) || typeof q.answer !== 'number') {
                        return `题目 ${q.id || '?'} 缺少必要字段（id/question/options/answer）`;
                    }
                    if (q.answer < 0 || q.answer >= q.options.length) return `题目 ${q.id} 答案索引越界`;
                }
            }
            return null;
        }

        function normalizeExam(data) {
            if (!data.description) data.description = '';
            if (!data.level) data.level = '';
            data.importedAt = new Date().toISOString();
            data.sections.forEach(sec => {
                sec.questions.forEach(q => {
                    if (!q.type) q.type = sec.id;
                    if (!q.sectionId) q.sectionId = sec.id;
                    if (!q.sectionName) q.sectionName = sec.name;
                    if (!q.explanation) q.explanation = '';
                });
            });
        }

        function deleteExam(idx) {
            if (!confirm('确定删除这套真题吗？')) return;
            exams.splice(idx, 1);
            saveExams();
            renderList();
        }

        function startExam(idx) {
            currentExam = exams[idx];
            currentQuestions = currentExam.sections.flatMap(s => s.questions.map(q => ({...q, sectionId: s.id, sectionName: s.name})));
            shuffle(currentQuestions);
            currentIdx = 0;
            correctCount = 0;
            sectionStats = {};
            currentAnswers = [];
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentIdx];
            const progress = ((currentIdx) / currentQuestions.length) * 100;
            const bookmarked = isBookmarked(q);
            stageEl.innerHTML = `
                <div class="topbar" style="position:static;margin-bottom:15px;">
                    <a href="javascript:renderList()" class="back">← 退出</a>
                    <div class="level-title">${escapeHtml(currentExam.title)}</div>
                    <div style="width:40px"></div>
                </div>
                <div class="quiz-top">
                    <span>第 ${currentIdx + 1} / ${currentQuestions.length} 题</span>
                    <span>${escapeHtml(q.sectionName)}</span>
                </div>
                <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
                <div class="question-card">
                    <button class="bookmark-btn ${bookmarked ? 'active' : ''}" id="bookmarkBtn" title="收藏">${bookmarked ? '★' : '☆'}</button>
                    <div class="q-type">${typeLabel(q.type)}</div>
                    <div class="q-main">${escapeHtml(q.question)}</div>
                    ${q.sub ? `<div class="q-sub">${escapeHtml(q.sub)}</div>` : ''}
                </div>
                <div class="choices" id="choices"></div>
                <div class="feedback hidden" id="feedback"></div>
                <button class="next-btn hidden" id="nextBtn">下一题</button>
            `;
            document.getElementById('bookmarkBtn').addEventListener('click', () => {
                const now = toggleBookmark(q);
                document.getElementById('bookmarkBtn').innerHTML = now ? '★' : '☆';
                document.getElementById('bookmarkBtn').classList.toggle('active', now);
            });
            const choicesEl = document.getElementById('choices');
            q.options.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = 'choice';
                btn.innerHTML = `<div class="badge">${String.fromCharCode(65 + i)}</div><div>${escapeHtml(opt)}</div>`;
                btn.addEventListener('click', () => selectOption(i));
                choicesEl.appendChild(btn);
            });
            document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        }

        function typeLabel(type) {
            const map = {
                'moji': '文字・語彙',
                'bunpou': '文法',
                'kanji_reading': '漢字読み',
                'kanji_usage': '漢字表記',
                'context_vocabulary': '文脈語彙',
                'synonym': '類義語・反対語',
                'grammar_form': '文法形式',
                'sentence_pattern': '文の文法',
                'grammar_meaning': '语法含义',
                'grammar_pattern': '语法接续',
                'word_meaning': '词义选择',
                'word_recognition': '看义选词'
            };
            return map[type] || type;
        }

        function selectOption(idx) {
            const q = currentQuestions[currentIdx];
            const correct = idx === q.answer;
            const choices = document.querySelectorAll('.choice');
            choices.forEach((c, i) => {
                c.classList.add('disabled');
                if (i === q.answer) c.classList.add('correct');
                else if (i === idx) c.classList.add('wrong');
            });
            if (correct) {
                correctCount++;
                sectionStats[q.sectionId] = sectionStats[q.sectionId] || { name: q.sectionName, total: 0, correct: 0 };
                sectionStats[q.sectionId].total++;
                sectionStats[q.sectionId].correct++;
            } else {
                sectionStats[q.sectionId] = sectionStats[q.sectionId] || { name: q.sectionName, total: 0, correct: 0 };
                sectionStats[q.sectionId].total++;
            }
            currentAnswers.push({ selected: idx, correct: correct, q: q });

            const fb = document.getElementById('feedback');
            fb.className = `feedback ${correct ? 'correct' : 'wrong'}`;
            fb.innerHTML = `
                <div class="feedback-title">${correct ? '✓ 回答正确' : '✗ 回答错误'}</div>
                <div class="feedback-detail">${escapeHtml(q.explanation || '正确答案是：' + q.options[q.answer])}</div>
            `;
            fb.classList.remove('hidden');
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.textContent = currentIdx === currentQuestions.length - 1 ? '查看结果' : '下一题';
            nextBtn.classList.remove('hidden');
            nextBtn.focus();
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx >= currentQuestions.length) {
                renderResult();
            } else {
                renderQuestion();
            }
        }

        function renderResult() {
            const total = currentQuestions.length;
            const wrong = total - correctCount;
            const pct = total ? Math.round((correctCount / total) * 100) : 0;
            const deg = pct * 3.6;
            stageEl.innerHTML = `
                <div class="panel">
                    <div class="result-score">
                        <div class="score-ring" style="--score-deg:${deg}deg;">
                            <div class="score-text">${pct}%</div>
                            <div class="score-label">正确率</div>
                        </div>
                        <div class="result-title">${scoreComment(pct)}</div>
                        <div class="result-desc">${escapeHtml(currentExam.title)}</div>
                    </div>
                    <div class="stat-row">
                        <div class="stat"><div class="num">${correctCount}</div><div class="label">正确</div></div>
                        <div class="stat"><div class="num">${wrong}</div><div class="label">错误</div></div>
                        <div class="stat"><div class="num">${total}</div><div class="label">总计</div></div>
                    </div>
                    <div class="section-stat">
                        <h3>各单元正确率</h3>
                        ${Object.values(sectionStats).map(s => `
                            <div class="section-bar">
                                <div class="name">${escapeHtml(s.name)}</div>
                                <div class="track"><div class="fill" style="width:${Math.round(s.correct/s.total*100)}%"></div></div>
                                <div class="pct">${Math.round(s.correct/s.total*100)}%</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="btn-row">
                        <button class="btn-primary" onclick="startExamById('${currentExam.importedAt}')">再做一次</button>
                        <button class="btn-secondary" onclick="renderReview('wrong')">错题解析</button>
                        <button class="btn-secondary" onclick="renderReview('all')">全部解析</button>
                        <button class="btn-secondary" onclick="renderList()">真题列表</button>
                    </div>
                </div>
            `;
            saveHistory({ exam: currentExam, total, correct: correctCount, pct, sectionStats, answers: currentAnswers, date: new Date().toISOString() });
        }

        function startExamById(importedAt) {
            const idx = exams.findIndex(e => e.importedAt === importedAt);
            if (idx >= 0) startExam(idx);
            else alert('真题未找到');
        }

        function renderReview(filter) {
            const list = filter === 'wrong' ? currentAnswers.filter(a => !a.correct) : currentAnswers;
            stageEl.innerHTML = `
                <div class="topbar" style="position:static;margin-bottom:15px;">
                    <a href="javascript:renderResult()" class="back">← 返回结果</a>
                    <div class="level-title">${filter === 'wrong' ? '错题解析' : '全部解析'}</div>
                    <div style="width:40px"></div>
                </div>
                <div class="review-filter">
                    <button class="${filter === 'all' ? 'active' : ''}" onclick="renderReview('all')">全部(${currentAnswers.length})</button>
                    <button class="${filter === 'wrong' ? 'active' : ''}" onclick="renderReview('wrong')">仅错题(${currentAnswers.filter(a=>!a.correct).length})</button>
                </div>
                <div class="review-list">
                    ${list.length ? list.map((a, i) => renderReviewItem(a, i+1)).join('') : '<div class="msg">暂无错题，真棒！</div>'}
                </div>
            `;
        }

        function renderReviewItem(a, i) {
            const q = a.q;
            const badge = a.correct ? '<span class="tag">✓ 答对</span>' : '<span class="tag wrong">✗ 答错</span>';
            const yourAnswer = q.options[a.selected] || '未作答';
            const correctAnswer = q.options[q.answer] || '';
            return `
                <div class="review-item">
                    <div class="review-header">
                        <div style="font-size:12px;color:var(--text-muted);">第 ${i} 题 · ${escapeHtml(typeLabel(q.type))}</div>
                        ${badge}
                    </div>
                    <div class="rev-q">${escapeHtml(q.question)}${q.sub ? `<br><span style="font-size:13px;color:var(--primary-text);">${escapeHtml(q.sub)}</span>` : ''}</div>
                    <div class="rev-ans">
                        <div>你的答案：<span class="${a.correct ? 'right' : 'wrong'}">${escapeHtml(yourAnswer)}</span></div>
                        ${a.correct ? '' : `<div>正确答案：<span class="right">${escapeHtml(correctAnswer)}</span></div>`}
                    </div>
                    <div class="rev-exp">${escapeHtml(q.explanation || '正确答案是：' + q.options[q.answer])}</div>
                </div>
            `;
        }

        function scoreComment(pct) {
            if (pct >= 90) return '优秀！';
            if (pct >= 75) return '不错，继续巩固';
            if (pct >= 60) return '及格，还有提升空间';
            return '加油，多复习错题';
        }

        function getHistory() {
            try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
            catch { return []; }
        }
        function saveHistory(record) {
            const history = getHistory();
            history.unshift(record);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 50)));
        }

        function showBookmarks() {
            loadBookmarks();
            const list = currentBookmarks;
            stageEl.innerHTML = `
                <div class="topbar" style="position:static;margin-bottom:15px;">
                    <a href="javascript:renderList()" class="back">← 返回</a>
                    <div class="level-title">我的收藏 (${list.length})</div>
                    <div style="width:40px"></div>
                </div>
                <div class="review-filter">
                    <button class="active" onclick="showBookmarks()">全部</button>
                    <button class="btn-secondary" onclick="clearAllBookmarks()">清空收藏</button>
                </div>
                <div class="review-list">
                    ${list.length ? list.map((b, i) => `
                        <div class="review-item">
                            <div class="review-header">
                                <div style="font-size:12px;color:var(--text-muted);">${escapeHtml(b.examTitle || '')} · ${escapeHtml(typeLabel(b.type))}</div>
                                <span class="tag" style="cursor:pointer;" onclick="removeBookmarkFromList('${b.qid}')">取消收藏</span>
                            </div>
                            <div class="rev-q">${escapeHtml(b.question)}</div>
                            <div class="rev-ans">正确答案：<span class="right">${escapeHtml(b.options[b.answer])}</span></div>
                            <div class="rev-exp">${escapeHtml(b.explanation)}</div>
                        </div>
                    `).join('') : '<div class="msg">暂无收藏题目</div>'}
                </div>
            `;
        }

        function removeBookmarkFromList(qid) {
            currentBookmarks = currentBookmarks.filter(b => b.qid !== qid);
            saveBookmarks();
            showBookmarks();
        }
        function clearAllBookmarks() {
            if (!confirm('确定清空所有收藏吗？')) return;
            currentBookmarks = [];
            saveBookmarks();
            showBookmarks();
        }

        function showStatistics() {
            const history = getHistory();
            const totalDone = history.reduce((sum, h) => sum + h.total, 0);
            const totalCorrect = history.reduce((sum, h) => sum + h.correct, 0);
            const avgPct = totalDone ? Math.round((totalCorrect / totalDone) * 100) : 0;
            const sessions = history.length;
            const weakMap = {};
            for (const h of history) {
                for (const a of (h.answers || [])) {
                    if (!a.correct) {
                        const key = a.q.type || 'unknown';
                        weakMap[key] = (weakMap[key] || 0) + 1;
                    }
                }
            }
            const weakList = Object.entries(weakMap).sort((a,b) => b[1]-a[1]).slice(0,5);
            stageEl.innerHTML = `
                <div class="topbar" style="position:static;margin-bottom:15px;">
                    <a href="javascript:renderList()" class="back">← 返回</a>
                    <div class="level-title">练习统计</div>
                    <div style="width:40px"></div>
                </div>
                <div class="dashboard-row">
                    <div class="dash-card"><div class="num">${sessions}</div><div class="label">练习次数</div></div>
                    <div class="dash-card"><div class="num">${totalDone}</div><div class="label">总做题</div></div>
                    <div class="dash-card"><div class="num">${avgPct}%</div><div class="label">总正确率</div></div>
                </div>
                <div class="panel" style="margin-bottom:16px;">
                    <h2>薄弱点 TOP5</h2>
                    ${weakList.length ? `<div class="section-stat" style="margin-top:12px;">
                        ${weakList.map(([type, count]) => `
                            <div class="section-bar">
                                <div class="name">${escapeHtml(typeLabel(type))}</div>
                                <div class="track"><div class="fill" style="width:100%;background:var(--danger);"></div></div>
                                <div class="pct">${count} 错</div>
                            </div>
                        `).join('')}
                    </div>` : '<div class="msg">还没有错题数据，继续练习吧！</div>'}
                </div>
                <div class="panel">
                    <h2>历史记录</h2>
                    <div class="history-list" style="margin-top:12px;">
                        ${history.length ? history.map(h => `
                            <div class="history-item">
                                <div>
                                    <div class="title">${escapeHtml(h.examTitle || '练习')}</div>
                                    <div class="meta">${formatDate(h.date)} · ${h.correct}/${h.total} 正确</div>
                                </div>
                                <div class="pct">${h.pct}%</div>
                            </div>
                        `).join('') : '<div class="msg">暂无历史记录</div>'}
                    </div>
                </div>
                <button class="btn btn-secondary" style="margin-top:16px;" onclick="clearHistory()">清空历史记录</button>
            `;
        }

        function clearHistory() {
            if (!confirm('确定清空所有练习历史吗？')) return;
            localStorage.removeItem(HISTORY_KEY);
            showStatistics();
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        init();
    </script>
</body>
</html>
