<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JLPT 日语学习</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Hiragino Sans", sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .levels {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .level-card {
            background: white;
            border-radius: 20px;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            color: inherit;
        }
        .level-badge {
            display: inline-block;
            width: 52px;
            height: 52px;
            line-height: 52px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }
        .level-card h3 { font-size: 17px; margin-bottom: 12px; }
        .mode-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .mode-btn {
            display: block;
            text-decoration: none;
            border-radius: 12px;
            padding: 10px 4px;
            font-size: 14px;
            font-weight: 500;
            background: #f3f4f6;
            color: #4b5563;
            border: 1px solid #e5e7eb;
        }
        .mode-btn:active { transform: scale(0.97); }
        .mode-btn.words { background: #eff6ff; color: #2563eb; border-color: #dbeafe; }
        .mode-btn.grammar { background: #f0fdf4; color: #16a34a; border-color: #dcfce7; }
        .progress-row {
            margin-top: 12px;
            font-size: 12px;
            color: #6b7280;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .n5 .level-badge { background: #4ade80; }
        .n4 .level-badge { background: #60a5fa; }
        .n3 .level-badge { background: #fbbf24; color: #333; }
        .n2 .level-badge { background: #f87171; }
        .n1 .level-badge { background: #a78bfa; }
    </style>
</head>
<body>
    <div class="header">
        <h1>JLPT 日语学习</h1>
        <p>词汇 + 语法 · N1-N5 全等级</p>
    </div>
    <div class="levels" id="levels"></div>

    <script>
        const levels = [
            { id: 'N5', name: 'N5 入门', colorClass: 'n5' },
            { id: 'N4', name: 'N4 基础', colorClass: 'n4' },
            { id: 'N3', name: 'N3 中阶', colorClass: 'n3' },
            { id: 'N2', name: 'N2 中高', colorClass: 'n2' },
            { id: 'N1', name: 'N1 高级', colorClass: 'n1' }
        ];

        function getProgress(level, kind) {
            const key = kind === 'words' ? `jlpt_progress_${level}` : `jlpt_grammar_progress_${level}`;
            const known = JSON.parse(localStorage.getItem(key) || '[]');
            return known.length;
        }

        async function render() {
            const summary = await fetch('content/summary.json').then(r => r.json());
            const container = document.getElementById('levels');
            container.innerHTML = levels.map(lv => {
                const wordsTotal = summary[`${lv.id}_words`] || 0;
                const grammarTotal = summary[`${lv.id}_grammar`] || 0;
                const wordsDone = getProgress(lv.id, 'words');
                const grammarDone = getProgress(lv.id, 'grammar');
                return `
                    <div class="level-card ${lv.colorClass}">
                        <div class="level-badge">${lv.id}</div>
                        <h3>${lv.name}</h3>
                        <div class="mode-btns">
                            <a href="study.html?level=${lv.id}" class="mode-btn words">词汇 ${wordsTotal}</a>
                            <a href="grammar.html?level=${lv.id}" class="mode-btn grammar">语法 ${grammarTotal}</a>
                        </div>
                        <div class="progress-row">
                            <span>词 ${wordsDone}/${wordsTotal}</span>
                            <span>法 ${grammarDone}/${grammarTotal}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
        render();
    </script>
</body>
</html>
