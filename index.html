<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JLPT 词汇学习</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Hiragino Sans", sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .levels {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .level-card {
            background: white;
            border-radius: 20px;
            padding: 22px 18px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .level-card:active { transform: scale(0.97); }
        .level-badge {
            display: inline-block;
            width: 56px;
            height: 56px;
            line-height: 56px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            color: white;
            margin-bottom: 12px;
        }
        .level-card h3 { font-size: 18px; margin-bottom: 6px; }
        .level-card .count { font-size: 13px; color: #888; }
        .level-card .progress {
            margin-top: 12px;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
        }
        .level-card .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.5s;
        }
        .level-card .progress-text {
            font-size: 12px;
            color: #667eea;
            margin-top: 6px;
        }
        .n5 .level-badge { background: #4ade80; }
        .n4 .level-badge { background: #60a5fa; }
        .n3 .level-badge { background: #fbbf24; color: #333; }
        .n2 .level-badge { background: #f87171; }
        .n1 .level-badge { background: #a78bfa; }
    </style>
</head>
<body>
    <div class="header">
        <h1>JLPT 词汇学习</h1>
        <p>基于 5mdld/anki-jlpt-decks · N1-N5 全等级</p>
    </div>
    <div class="levels" id="levels"></div>

    <script>
        const levels = [
            { id: 'N5', name: 'N5 入门', colorClass: 'n5' },
            { id: 'N4', name: 'N4 基础', colorClass: 'n4' },
            { id: 'N3', name: 'N3 中阶', colorClass: 'n3' },
            { id: 'N2', name: 'N2 中高', colorClass: 'n2' },
            { id: 'N1', name: 'N1 高级', colorClass: 'n1' }
        ];

        function getProgress(level) {
            const known = JSON.parse(localStorage.getItem(`jlpt_progress_${level}`) || '[]');
            return known.length;
        }

        async function render() {
            const summary = await fetch('content/summary.json').then(r => r.json());
            const container = document.getElementById('levels');
            container.innerHTML = levels.map(lv => {
                const total = summary[lv.id] || 0;
                const done = getProgress(lv.id);
                const pct = total ? Math.round(done / total * 100) : 0;
                return `
                    <a href="study.html?level=${lv.id}" class="level-card ${lv.colorClass}">
                        <div class="level-badge">${lv.id}</div>
                        <h3>${lv.name}</h3>
                        <div class="count">${total.toLocaleString()} 词</div>
                        <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
                        <div class="progress-text">已掌握 ${done} / ${total}</div>
                    </a>
                `;
            }).join('');
        }
        render();
    </script>
</body>
</html>
