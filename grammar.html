<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="JLPT 日语学习应用，支持 N1-N5 词汇、语法学习与真题测试">
    <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="JLPT学习">
        <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" href="icons/icon-96x96.png">
<title>JLPT 语法学习</title>
    <link rel="stylesheet" href="css/common.css?v=4">
    <style>
        /* 跳转弹窗（复用 study.html 样式） */
        .jump-overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .jump-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .jump-modal {
            background: var(--surface);
            width: 100%;
            max-width: 480px;
            border-radius: 24px 24px 0 0;
            padding: 22px 24px 30px;
            box-shadow: var(--shadow-lg);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .jump-overlay.active .jump-modal {
            transform: translateY(0);
        }
        .jump-modal h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .jump-modal p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }
        .jump-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.25s, color 0.25s;
            margin-bottom: 8px;
        }
        .jump-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--ring);
        }
        .jump-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            min-height: 18px;
        }
        .jump-actions {
            display: flex;
            gap: 12px;
        }
        .jump-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .jump-actions button:active {
            transform: scale(0.97);
        }
        .jump-btn-primary {
            background: var(--primary-grad);
            color: white;
        }
        .jump-btn-secondary {
            background: var(--surface-3);
            color: var(--text);
            border: 1px solid var(--border) !important;
        }
        .btn-jump {
            background: var(--accent-5);
        }

        /* grammar.html 卡片背面分块样式 */
        .grammar-back {
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }
        .grammar-back::-webkit-scrollbar { width: 6px; }
        .grammar-back::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        .grammar-back .section {
            background: var(--surface-2);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 14px;
            text-align: left;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }
        .grammar-back .section:last-child { margin-bottom: 0; }

        .grammar-back .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .grammar-back .meaning-text,
        .grammar-back .usage-text {
            font-size: 15px;
            line-height: 1.65;
            color: var(--text);
            white-space: pre-wrap;
        }

        .grammar-back .pattern-box {
            background: var(--warning-soft);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            color: var(--warning-text);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .grammar-back .example-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .grammar-back .example-list li {
            background: var(--surface);
            border-left: 3px solid var(--primary);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 15px;
            line-height: 1.55;
            color: var(--text);
        }
        .grammar-back .example-list li:last-child { margin-bottom: 0; }
        .grammar-back .example-list .example-ja {
            display: block;
            font-size: 15px;
            color: var(--text);
            margin-bottom: 2px;
        }
        .grammar-back .example-list .example-reading {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }
        .grammar-back .example-list .example-meaning {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .grammar-back .mistake-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .grammar-back .mistake-list li {
            background: var(--danger-soft);
            border-radius: 10px;
            padding: 9px 12px;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--danger-text);
            line-height: 1.5;
        }

        .grammar-back .note-text,
        .grammar-back .compare-text {
            font-size: 14px;
            line-height: 1.65;
            color: var(--text);
            white-space: pre-wrap;
        }
        .grammar-back .compare-text {
            background: var(--info-soft);
            border-radius: 12px;
            padding: 12px 14px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="back">← 返回</a>
        <div class="level-title" id="levelTitle">N5</div>
        <div class="progress-info" id="progressInfo">0 / 0</div>
    </div>
    <div class="stage" id="stage">
        <div class="msg">加载中...</div>
    </div>

    <div class="jump-overlay" id="jumpOverlay" onclick="if(event.target===this) closeJump()">
        <div class="jump-modal">
            <h3>🔍 跳转到语法点</h3>
            <p>输入序号（1~<span id="jumpTotal">0</span>）或关键词</p>
            <input type="text" class="jump-input" id="jumpInput" placeholder="例如：12 或 〜わけにはいかない" autocomplete="off">
            <div class="jump-hint" id="jumpHint"></div>
            <div class="jump-actions">
                <button class="jump-btn-secondary" onclick="closeJump()">取消</button>
                <button class="jump-btn-primary" onclick="doJump()">跳转</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const level = params.get('level') || 'N5';
        const titleEl = document.getElementById('levelTitle');
        const progressEl = document.getElementById('progressInfo');
        const stageEl = document.getElementById('stage');
        titleEl.textContent = level;

        let items = [];
        let index = 0;
        let known = new Set();
        let autoFlip = localStorage.getItem('jlpt_grammar_auto_flip') === 'true';
        let synth = window.speechSynthesis;
        let japaneseVoice = null;

        function findJapaneseVoice() {
            const voices = synth.getVoices();
            for (const v of voices) {
                if (v.lang.startsWith('ja')) { japaneseVoice = v; break; }
            }
        }
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = findJapaneseVoice;
        }
        findJapaneseVoice();

        function speak(text, rate = 0.82) {
            if (!synth) return;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ja-JP';
            utter.rate = rate;
            utter.pitch = 1.0;
            if (japaneseVoice) utter.voice = japaneseVoice;
            synth.speak(utter);
        }

        function loadProgress() {
            const saved = localStorage.getItem(`jlpt_grammar_progress_${level}`);
            if (saved) known = new Set(JSON.parse(saved));
            autoFlip = localStorage.getItem('jlpt_grammar_auto_flip') === 'true';
        }
        function saveProgress() {
            localStorage.setItem(`jlpt_grammar_progress_${level}`, JSON.stringify([...known]));
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function nl2br(text) {
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function section(title, icon, body) {
            return `<div class="section"><div class="section-title">${icon} ${escapeHtml(title)}</div>${body}</div>`;
        }

        function renderDescription(g) {
            let html = '';
            if (g.meaning || g.grammar_cn) {
                const title = g.grammar_cn ? `${escapeHtml(g.grammar)}（${escapeHtml(g.grammar_cn)}）` : escapeHtml(g.grammar);
                html += `<div class="grammar-title"><strong>${title}</strong></div>`;
            }
            if (g.meaning) {
                html += section('含义', '💡', `<div class="meaning-text">${nl2br(g.meaning)}</div>`);
            }
            if (g.usage) {
                html += section('用法', '📘', `<div class="usage-text">${nl2br(g.usage)}</div>`);
            }
            if (g.pattern) {
                html += section('接续', '📐', `<div class="pattern-box">${nl2br(g.pattern)}</div>`);
            }
            const examples = g.examples && g.examples.length ? g.examples : (g.example ? [{
                example: g.example,
                example_reading: g.example_reading,
                example_meaning: g.example_meaning
            }] : []);
            if (examples.length) {
                const exHtml = examples.map(ex =>
                    `<li>` +
                    `${ex.example ? `<span class="example-ja">${escapeHtml(ex.example)}</span>` : ''}` +
                    `${ex.example_reading ? `<span class="example-reading">${escapeHtml(ex.example_reading)}</span>` : ''}` +
                    `${ex.example_meaning ? `<span class="example-meaning">${escapeHtml(ex.example_meaning)}</span>` : ''}` +
                    `</li>`
                ).join('');
                html += section('例句', '📝', `<ul class="example-list">${exHtml}</ul>`);
            }
            const mistakes = g.common_mistakes || (g.mistakes ? [g.mistakes] : []);
            if (mistakes && mistakes.length) {
                const mHtml = mistakes.map(m => `<li>${nl2br(m)}</li>`).join('');
                html += section('常见错误', '⚠️', `<ul class="mistake-list">${mHtml}</ul>`);
            }
            const comparison = g.comparison || g.compare || '';
            if (comparison) {
                html += section('辨析', '🔍', `<div class="compare-text">${nl2br(comparison)}</div>`);
            }
            if (g.notes) {
                html += section('注意', '💬', `<div class="note-text">${nl2br(g.notes)}</div>`);
            }
            return html;
        }

        function renderCardContent(g) {
            const hint = g.grammar_cn ? escapeHtml(g.grammar_cn) : '点击卡片查看释义';
            return {
                front: `
                    <div class="grammar">${escapeHtml(g.grammar)}</div>
                    <div class="hint">${hint}</div>
                `,
                back: `
                    <div class="grammar-back">${renderDescription(g)}</div>
                `
            };
        }

        function cardHtml(g, cls) {
            const content = renderCardContent(g);
            const flipped = autoFlip ? 'flipped' : '';
            return `
                <div class="card ${cls} ${flipped}" data-id="${g.id}">
                    <div class="front-face">${content.front}</div>
                    <div class="back-face">${content.back}</div>
                </div>
            `;
        }

        function render() {
            if (!items.length) {
                stageEl.innerHTML = '<div class="msg">暂无语法数据</div>';
                return;
            }
            if (index >= items.length) {
                stageEl.innerHTML = `
                    <div class="msg">
                        <h2>🎉 ${level} 语法已完成</h2>
                        <p>本轮共 ${items.length} 条语法，已掌握 ${known.size} 条</p>
                        <button class="btn btn-known" onclick="restart()" style="margin-top:20px;">重新开始</button>
                    </div>
                `;
                progressEl.textContent = `${known.size} / ${items.length}`;
                return;
            }
            const g = items[index];
            const nextG = items[index + 1];
            const isKnown = known.has(g.id);
            progressEl.textContent = `${index + 1} / ${items.length} · 已掌握 ${known.size}`;
            stageEl.innerHTML = `
                <div class="settings-bar">
                    <label class="setting-label">
                        <input type="checkbox" id="autoFlipCheck" ${autoFlip ? 'checked' : ''}>
                        默认展开释义
                    </label>
                </div>
                <div class="card-stack" id="cardStack">
                    ${nextG ? cardHtml(nextG, 'next') : ''}
                    ${cardHtml(g, 'current')}
                </div>
                <div class="btn-group">
                    <button class="btn btn-grammar" onclick="event.stopPropagation(); speakGrammar()">🔊 读法</button>
                    ${g.example ? `<button class="btn btn-example" onclick="event.stopPropagation(); speakExample()">📝 例句</button>` : ''}
                    <button class="btn btn-jump" onclick="event.stopPropagation(); showJump()">🔍 跳转</button>
                    <button class="btn ${isKnown ? 'btn-unknown' : 'btn-known'}" onclick="event.stopPropagation(); toggleKnown()">${isKnown ? '取消掌握' : '✓ 掌握'}</button>
                </div>
                <div class="controls">
                    <button class="nav-btn" onclick="prev()" ${index === 0 ? 'disabled' : ''}>← 上一个</button>
                    <button class="nav-btn" onclick="next()">下一个 →</button>
                </div>
            `;

            const autoFlipCheck = document.getElementById('autoFlipCheck');
            if (autoFlipCheck) {
                autoFlipCheck.addEventListener('change', (e) => {
                    autoFlip = e.target.checked;
                    localStorage.setItem('jlpt_grammar_auto_flip', autoFlip ? 'true' : 'false');
                    render();
                });
            }

            setupCardClick();
            setupSwipe();
        }

        function setupCardClick() {
            const card = document.querySelector('#cardStack .card.current');
            if (!card) return;
            card.addEventListener('click', (e) => {
                if (card.dataset.swiped === 'true') {
                    card.dataset.swiped = 'false';
                    return;
                }
                card.classList.toggle('flipped');
            });
        }

        function setupSwipe() {
            const card = document.querySelector('#cardStack .card.current');
            if (!card) return;

            let startX = 0;
            let currentX = 0;
            let isDragging = false;

            const onStart = (x) => {
                startX = x;
                currentX = x;
                isDragging = true;
                card.style.transition = 'none';
                card.dataset.swiped = 'false';
            };
            const onMove = (x) => {
                if (!isDragging) return;
                currentX = x;
                const dx = currentX - startX;
                card.style.transform = `translateX(${dx}px) rotate(${dx * 0.03}deg)`;
            };
            const onEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                card.style.transition = '';
                const dx = currentX - startX;
                if (dx < -80) {
                    card.dataset.swiped = 'true';
                    card.classList.add('sliding-left');
                    setTimeout(next, 250);
                } else if (dx > 80) {
                    card.dataset.swiped = 'true';
                    card.classList.add('sliding-right');
                    setTimeout(prev, 250);
                } else {
                    card.style.transform = '';
                }
            };

            card.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX), { passive: true });
            card.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
            card.addEventListener('touchend', onEnd);

            card.addEventListener('mousedown', (e) => onStart(e.clientX));
            window.addEventListener('mousemove', (e) => onMove(e.clientX));
            window.addEventListener('mouseup', onEnd);
        }

        function flip() {
            const card = document.querySelector('#cardStack .card.current');
            if (card) card.classList.toggle('flipped');
        }

        function speakGrammar() {
            const g = items[index];
            speak(`${g.grammar}、${g.reading}`);
        }

        function speakExample() {
            const g = items[index];
            const exampleText = (g.examples && g.examples[0] && g.examples[0].example) || g.example;
            if (exampleText) speak(exampleText);
        }

        function toggleKnown() {
            const g = items[index];
            if (known.has(g.id)) known.delete(g.id);
            else known.add(g.id);
            saveProgress();
            render();
        }

        function next() {
            if (synth) synth.cancel();
            index++;
            render();
        }

        function prev() {
            if (synth) synth.cancel();
            if (index > 0) index--;
            render();
        }

        function restart() {
            index = 0;
            render();
        }

        function showJump() {
            const overlay = document.getElementById('jumpOverlay');
            const totalEl = document.getElementById('jumpTotal');
            const input = document.getElementById('jumpInput');
            const hint = document.getElementById('jumpHint');
            if (totalEl) totalEl.textContent = items.length;
            if (hint) hint.textContent = '';
            if (input) {
                input.value = '';
                input.addEventListener('input', updateJumpHint);
                input.addEventListener('keydown', onJumpKey);
            }
            overlay.classList.add('active');
            setTimeout(() => input && input.focus(), 50);
        }

        function closeJump() {
            const overlay = document.getElementById('jumpOverlay');
            const input = document.getElementById('jumpInput');
            overlay.classList.remove('active');
            if (input) {
                input.removeEventListener('input', updateJumpHint);
                input.removeEventListener('keydown', onJumpKey);
            }
        }

        function updateJumpHint() {
            const input = document.getElementById('jumpInput');
            const hint = document.getElementById('jumpHint');
            const raw = input.value.trim();
            if (!raw) {
                hint.textContent = '';
                return;
            }
            if (/^\d+$/.test(raw)) {
                const n = parseInt(raw, 10);
                if (n >= 1 && n <= items.length) {
                    hint.textContent = `将跳转到第 ${n} 条：${items[n - 1].grammar}`;
                    hint.style.color = 'var(--text-secondary)';
                } else {
                    hint.textContent = `请输入 1~${items.length} 之间的序号`;
                    hint.style.color = 'var(--danger-text)';
                }
                return;
            }
            const term = raw.toLowerCase();
            const matches = items.filter(g =>
                (g.grammar && g.grammar.toLowerCase().includes(term)) ||
                (g.reading && g.reading.toLowerCase().includes(term)) ||
                (g.meaning && g.meaning.toLowerCase().includes(term))
            );
            if (matches.length === 0) {
                hint.textContent = '未找到匹配的语法点';
                hint.style.color = 'var(--danger-text)';
            } else {
                hint.textContent = `找到 ${matches.length} 条匹配，将跳转到第一条：${matches[0].grammar}`;
                hint.style.color = 'var(--text-secondary)';
            }
        }

        function onJumpKey(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                doJump();
            }
            if (e.key === 'Escape') {
                closeJump();
            }
        }

        function doJump() {
            const input = document.getElementById('jumpInput');
            const raw = input.value.trim();
            if (!raw) return;
            let target = -1;
            if (/^\d+$/.test(raw)) {
                const n = parseInt(raw, 10);
                if (n >= 1 && n <= items.length) target = n - 1;
            } else {
                const term = raw.toLowerCase();
                target = items.findIndex(g =>
                    (g.grammar && g.grammar.toLowerCase().includes(term)) ||
                    (g.reading && g.reading.toLowerCase().includes(term)) ||
                    (g.meaning && g.meaning.toLowerCase().includes(term))
                );
            }
            if (target === -1) return;
            if (synth) synth.cancel();
            index = target;
            closeJump();
            render();
        }

        async function init() {
            loadProgress();
            const basePath = location.pathname.replace(/\/[^\/]*$/, '/');
            const resp = await fetch(`${basePath}content/${level}_grammar.json`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            items = await resp.json();
            render();
        }
        init().catch(err => {
            console.error('加载失败', err);
            stageEl.innerHTML = `<div class="msg">加载失败：${err.message}<br>请刷新重试</div>`;
        });
    </script>
</body>
</html>
